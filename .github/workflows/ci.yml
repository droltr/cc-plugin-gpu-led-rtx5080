name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m compileall -q gpu_led tests

      - name: Validate JSON and shell syntax
        run: |
          python -m json.tool config.json >/dev/null
          bash -n install.sh run.sh

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
